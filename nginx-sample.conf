# إعداد nginx — منصة مراقبة الجودة (كاك بنك)
# انسخ الملف إلى /etc/nginx/conf.d/quality.conf وعدّل المسارات والشهادة.
# الاستخدام: موقع ويب ثابت، لا واجهة خلفية ولا قاعدة بيانات.

server {
    listen 80;
    server_name quality.kakbank.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name quality.kakbank.local;

    root /srv/kak-quality;          # مجلد المنصة (index.html و assets)
    index index.html;

    ssl_certificate     /etc/ssl/certs/quality.crt;
    ssl_certificate_key /etc/ssl/private/quality.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ترويسات أمان
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # لا تخزين مؤقت للصفحة الرئيسية (حتى تظهر التحديثات فورًا)
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # الأصول الثابتة: تخزين مؤقت أسبوع
    location ~* \.(?:js|css|png|jpe?g|svg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # توجيه كل المسارات إلى index.html (التوجيه داخل الصفحة عبر #/)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
}
